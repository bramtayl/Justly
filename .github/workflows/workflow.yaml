on:
  push:
env:
  instruments_url: "https://github.com/musescore/MuseScore/raw/v4.7.4/share/sound"
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg_archives,readwrite"
jobs:
  main_job:
    continue-on-error: true
    strategy:
      matrix:
        include:
          - os: macos-latest
            family: macos
            cpack_generator: ZIP
            package_name: Justly-MacOS-arm64
          - os: macos-15-intel
            family: macos
            cpack_generator: ZIP
            package_name: Justly-MacOS-Intel
          - os: ubuntu-26.04
            family: ubuntu
            cpack_generator: TGZ
            package_name: Justly-Linux
          - os: windows-latest
            family: windows
            cpack_generator: ZIP
            package_name: Justly-Windows
    runs-on: ${{matrix.os}}
    steps:
    - name: Download
      uses: actions/checkout@v7

    - name: Update Ubuntu
      if: matrix.family == 'ubuntu'
      run: sudo apt-get update

    - name: Install dependencies on Ubuntu
      if: matrix.family == 'ubuntu'
      run: >
        sudo apt-get install
        binutils
        cmake
        fluidsynth
        libfluidsynth-dev
        libqt6svg6-dev
        libxml2-dev
        libzip-dev
        qt6-base-dev
        qt6-gtk-platformtheme

    - name: Install baseline runtime libraries on Ubuntu
      if: matrix.family == 'ubuntu'
      run: >
        sudo apt-get install
        libapparmor1
        libasound2t64
        libdbus-1-3
        libpipewire-0.3-0t64
        libpulse0
        libsystemd0
        libwayland-client0
        libx11-6
        libxcb1

    - name: Install gcovr on Ubuntu
      if: matrix.family == 'ubuntu'
      run: pipx install gcovr

    - name: Install dependencies on MacOS
      if: matrix.family == 'macos'
      run: brew install fluid-synth ninja qt libxml2 libzip

    - name: Add MSVC to path on Windows
      if: matrix.family == 'windows'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install cmake on Windows
      if: matrix.family == 'windows'
      uses: lukka/get-cmake@latest
      with:
        cmakeVersion: "~4.4.0"

    - name: Install Qt on Windows
      if: matrix.family == 'windows'
      uses: jurplel/install-qt-action@v4
      with:
        version: "6.10.1"
        cache: true

    - name: Restore vcpkg binary cache
      if: matrix.family == 'windows'
      uses: actions/cache@v6
      with:
        path: vcpkg_archives
        key: windows-latest-vcpkg_archives-${{ hashFiles('vcpkg.json') }}

    - name: Install vcpkg packages on windows
      uses: lukka/run-vcpkg@v11
      if: matrix.family == 'windows'
      with:
        vcpkgGitCommitId: 'f6729a3ac3bfdefc999aa8e3664f8014370886b8'

    - name: Restore soundfont files from the cache if available
      id: soundfont_step
      uses: actions/cache@v6
      with:
        path: |
          share/MS_Basic.sf3
          share/MS_Basic_License.md
        key: ${{matrix.os}}-soundfont_cache-v3

    - name: Download the soundfont if not in the cache
      if: steps.soundfont_step.outputs.cache-hit != 'true'
      run: >
        curl -L "${{env.instruments_url}}/MS%20Basic.sf3"
        --output "share/MS_Basic.sf3"

    - name: Download the soundfont license if not in the cache
      if: steps.soundfont_step.outputs.cache-hit != 'true'
      run: >
        curl -L "${{env.instruments_url}}/MS%20Basic_License.md"
        --output "share/MS_Basic_License.md"

    - name: Configure with tests
      run: >
        cmake -S . -B with_tests
        -DBUILD_TESTS=ON
        -DCMAKE_BUILD_TYPE=Debug
        -DNO_REALTIME_AUDIO=ON
        ${{ matrix.family == 'windows' && format('-DCMAKE_TOOLCHAIN_FILE={0}/scripts/buildsystems/vcpkg.cmake', env.VCPKG_ROOT) || '-DTRACK_COVERAGE=ON' }}

    - name: Build with tests
      run: cmake --build with_tests --config Debug

    # proves the deploy script in CMakeLists.txt actually bundled everything
    # run_tests needs -- otherwise this and the Release build below would
    # both silently pass/link against the brew-installed copies regardless of
    # what macdeployqt actually bundled, since dyld falls back to any
    # load-command path macdeployqt failed to rewrite to a bundle-relative one
    - name: Remove dependencies before testing on MacOS
      if: matrix.family == 'macos'
      run: brew uninstall --ignore-dependencies fluid-synth qt libxml2 libzip && brew autoremove

    - name: Remove dependencies before testing on Ubuntu
      if: matrix.family == 'ubuntu'
      run: >
        sudo apt-get remove --purge -y
        fluidsynth
        libfluidsynth-dev
        libqt6svg6-dev
        libxml2-dev
        libzip-dev
        qt6-base-dev
        qt6-gtk-platformtheme
        && sudo apt-get autoremove --purge -y

    # runs the installed test binary directly instead of through ctest, with
    # its own timeout watchdog -- ctest's own captured stdout has the same
    # Start/Totals/Finished-goes-missing quirk as Windows here too, and a
    # bare `ctest --timeout` gives no attribution when a single test hangs.
    # QT_TEST_FUNCTION_TIMEOUT makes QTest itself abort (and name) whichever
    # test function is actually stuck; the 300s kill below is only a
    # last-resort backstop for a hang QTest's own watchdog doesn't catch
    # (e.g. before/after any test function runs)
    - name: Test on MacOS and Ubuntu
      if: matrix.family != 'windows'
      run: |
        cd with_tests
        if [ "${{ matrix.family }}" = "macos" ]; then
          exe="../test_install/JustlyTests.app/Contents/MacOS/JustlyTests"
        else
          exe="../test_install/bin/JustlyTests"
        fi

        QT_DEBUG_PLUGINS=1 QT_QPA_PLATFORM=offscreen QT_TEST_FUNCTION_TIMEOUT=120000 "$exe" -o test_output.txt,txt &
        pid=$!
        ( sleep 300 && kill -9 "$pid" 2>/dev/null ) &
        watchdog=$!

        run_tests_code=0
        wait "$pid" || run_tests_code=$?
        kill "$watchdog" 2>/dev/null || true
        wait "$watchdog" 2>/dev/null || true

        overall_code=$run_tests_code
        if [ "$run_tests_code" -ne 0 ]; then
          echo "::error::run_tests exited with code $run_tests_code (137 means it was killed after the 300s watchdog)"
        fi

        # separate from run_tests: launches via LaunchServices (as Finder
        # would) to catch bundle-structure problems that direct-binary
        # invocation above wouldn't (e.g. bad Info.plist); open's own exit
        # code only reflects whether the launch succeeded, not the app's
        # exit status, so this can't replace run_tests as a pass/fail check
        if [ "${{ matrix.family }}" = "macos" ]; then
          bundle_code=0
          open -W -a "../test_install/JustlyTests.app" || bundle_code=$?
          if [ "$bundle_code" -ne 0 ]; then
            echo "::error::bundle_opens exited with code $bundle_code"
            overall_code=$bundle_code
          fi
        fi

        exit "$overall_code"

    # ctest's captured stdout never contains QTest's own Start/Totals/
    # Finished summary on Windows (see CMakeLists.txt) -- the test now
    # writes that summary to a file instead, so print it here to keep it
    # visible in the CI log on every platform.
    - name: Show QTest output on MacOS and Ubuntu
      if: always() && matrix.family != 'windows'
      run: cat with_tests/test_output.txt

    # the Release build below links against these the same way the Debug
    # build did, so they have to come back before "Configure without tests
    # on MacOS"
    - name: Reinstall dependencies for the release build on MacOS
      if: matrix.family == 'macos'
      run: brew install fluid-synth qt libxml2 libzip

    # the Release build below links against these the same way the Debug
    # build did, so they have to come back before "Configure without tests
    # on Ubuntu"
    - name: Reinstall dependencies for the release build on Ubuntu
      if: matrix.family == 'ubuntu'
      run: >
        sudo apt-get install -y
        fluidsynth
        libfluidsynth-dev
        libqt6svg6-dev
        libxml2-dev
        libzip-dev
        qt6-base-dev
        qt6-gtk-platformtheme

    # same idea as the MacOS/Ubuntu steps above, but ld.so's system-directory
    # fallback and dyld's load-command rewriting don't apply on Windows --
    # instead install-qt-action puts Qt's own bin dir on PATH and sets
    # QT_PLUGIN_PATH, either of which could mask a gap in what
    # qt_generate_deploy_app_script/windeployqt actually deployed. This is
    # scoped to the step's own process, so no reinstall step is needed --
    # the Release build below still sees the original PATH/QT_PLUGIN_PATH.
    # runs the installed test binary directly instead of through ctest --
    # ctest's captured stdout never contains QTest's own Start/Totals/
    # Finished summary here (see CMakeLists.txt), and a hang inside ctest
    # gave zero attribution beyond "timed out after 1500s". QT_TEST_
    # FUNCTION_TIMEOUT makes QTest itself abort (and name) whichever test
    # function is actually stuck; the 300s kill below is only a last-resort
    # backstop, and dumps thread state so a hang outside any test function
    # is still diagnosable instead of silent
    - name: Test on Windows
      if: matrix.family == 'windows'
      shell: pwsh
      run: |
        $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notlike "$env:QT_ROOT_DIR*" }) -join ';'
        Remove-Item Env:\QT_PLUGIN_PATH -ErrorAction SilentlyContinue
        $env:QT_QPA_PLATFORM = "offscreen"
        $env:QT_TEST_FUNCTION_TIMEOUT = "120000"
        cd with_tests
        $exePath = (Resolve-Path "..\test_install\bin\JustlyTests.exe").Path
        $workDir = (Get-Location).Path
        $proc = Start-Process -FilePath $exePath -WorkingDirectory $workDir -ArgumentList "-o", "test_output.txt,txt" -NoNewWindow -PassThru -RedirectStandardOutput "run_tests_stdout.txt" -RedirectStandardError "run_tests_stderr.txt"
        $finished = $proc.WaitForExit(300000)
        if (-not $finished) {
          Write-Host "::error::run_tests timed out after 300s -- thread count: $($proc.Threads.Count)"
          Get-Process -Id $proc.Id | Select-Object -ExpandProperty Threads | Format-Table Id, ThreadState, WaitReason
          Write-Host "=== captured stdout so far ==="
          Get-Content run_tests_stdout.txt -ErrorAction SilentlyContinue
          Write-Host "=== captured stderr so far ==="
          Get-Content run_tests_stderr.txt -ErrorAction SilentlyContinue
          Stop-Process -Id $proc.Id -Force
          exit 1
        }
        if ($proc.ExitCode -ne 0) {
          Write-Host "::error::run_tests exited with code $($proc.ExitCode)"
          exit $proc.ExitCode
        }

    - name: Show QTest output on Windows
      if: always() && matrix.family == 'windows'
      shell: pwsh
      run: Get-Content with_tests/test_output.txt

    - name: Run gcovr
      if: matrix.family == 'ubuntu'
      # --filter targets library/ (renamed from src/ in 704b1074, which
      # silently broke this filter -- gcovr matched 0 files and uploaded an
      # empty report for the past year). Most `default: Q_ASSERT(false);`
      # arms of exhaustive switches over RowType/Qt::Orientation were removed
      # outright in the source (the compiler already proves them dead via
      # -Wswitch); --exclude-lines-by-pattern catches the handful that had to
      # stay because the switched-on enum has a fixed underlying type
      # (RowType : std::uint8_t) so the compiler can't prove exhaustiveness
      # and needs an explicit default to avoid -Wreturn-type. There are no
      # `throw` statements anywhere in library/ -- --exclude-throw-branches
      # drops the compiler-generated exception-unwind edges GCC adds to every
      # call to a non-noexcept function, which otherwise dominate the branch
      # count and can't be exercised without deliberately forcing failures
      # like std::bad_alloc.
      run: >
        gcovr --xml "coverage.xml"
        --filter "$(pwd)/library/"
        --exclude-lines-by-pattern "Q_ASSERT\(false\);"

    - name: Upload code coverage
      uses: codecov/codecov-action@v7
      if: matrix.family == 'ubuntu'
      with:
        files: ./coverage.xml
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Configure without tests
      run: >
        cmake -S . -B without_tests
        -DCMAKE_BUILD_TYPE=Release
        -DCPACK_GENERATOR=${{ matrix.cpack_generator }}
        -DCPACK_PACKAGE_FILE_NAME=${{ matrix.package_name }}
        ${{ matrix.family == 'windows' && format('-DCMAKE_TOOLCHAIN_FILE={0}/scripts/buildsystems/vcpkg.cmake', env.VCPKG_ROOT) || '' }}

    - name: Build without tests
      run: cmake --build without_tests --config Release

    - name: Package
      run: cd without_tests; cpack -C Release

    - name: Release on a new tag
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v3
      with:
        files: |
          **/Justly-*.tar.gz
          **/Justly-*.zip
