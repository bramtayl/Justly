on:
  push:
env:
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg_archives,readwrite"
  # build dependencies, removed before testing so the tests only see what
  # the deploy script bundled
  BREW_DEPS: fluid-synth qt libxml2
jobs:
  main_job:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            family: macos
            cpack_generator: ZIP
            package_name: Justly-MacOS-arm64
          - os: macos-15-intel
            family: macos
            cpack_generator: ZIP
            package_name: Justly-MacOS-Intel
          # Linux users get Justly from Flathub (see linux/), so this only
          # tests, and measures coverage
          - os: ubuntu-26.04
            family: ubuntu
          - os: windows-latest
            family: windows
            cpack_generator: WIX
            package_name: Justly-Windows
            qt_host: windows
            qt_arch: win64_msvc2022_64
          # the python and Qt are named explicitly so nothing falls back to an
          # x64 build running under emulation
          - os: windows-11-arm
            family: windows
            cpack_generator: WIX
            package_name: Justly-Windows-arm64
            python: cpython-3.13-windows-aarch64-none
            qt_host: windows_arm64
            qt_arch: win64_msvc2022_arm64
    runs-on: ${{matrix.os}}
    steps:
    - name: Download
      uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v6

    # into the python folder, where CMake finds it and copies it into the build
    - name: Install the python to bundle
      if: matrix.family != 'ubuntu'
      shell: bash
      run: |
        uv python install ${{ matrix.python || '3.13' }} --install-dir python --no-bin --no-registry
        uv pip install --python python/cpython-3.13.* --break-system-packages music21==10.5.0

    - name: Install dependencies on Ubuntu
      if: matrix.family == 'ubuntu'
      run: >
        sudo apt-get update &&
        sudo apt-get install -y
        cmake
        libfluidsynth-dev
        libqt6svg6-dev
        libxml2-dev
        qt6-base-dev

    # CMake's FindPython prefers the python of the virtual environment that
    # VIRTUAL_ENV names
    - name: Install music21 on Ubuntu
      if: matrix.family == 'ubuntu'
      run: |
        uv venv
        uv pip install music21==10.5.0
        echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"

    - name: Install gcovr on Ubuntu
      if: matrix.family == 'ubuntu'
      run: pipx install gcovr

    - name: Install dependencies on MacOS
      if: matrix.family == 'macos'
      run: brew install $BREW_DEPS

    - name: Install cmake on Windows
      if: matrix.family == 'windows'
      uses: lukka/get-cmake@v4.4.2
      with:
        cmakeVersion: "~4.4.0"

    # for CPack's WIX generator. The UI extension's version has to match
    - name: Install WiX on Windows
      if: matrix.family == 'windows'
      run: |
        dotnet tool install --global wix --version 5.0.2
        wix extension add --global WixToolset.UI.wixext/5.0.2

    - name: Install Qt on Windows
      if: matrix.family == 'windows'
      uses: jurplel/install-qt-action@v4
      with:
        version: "6.10.1"
        host: ${{ matrix.qt_host }}
        arch: ${{ matrix.qt_arch }}
        cache: true

    - name: Restore vcpkg binary cache
      if: matrix.family == 'windows'
      uses: actions/cache@v6
      with:
        path: vcpkg_archives
        key: ${{matrix.os}}-vcpkg_archives-${{ hashFiles('vcpkg.json') }}

    - name: Install vcpkg packages on windows
      uses: lukka/run-vcpkg@v11
      if: matrix.family == 'windows'
      with:
        vcpkgGitCommitId: 'f6729a3ac3bfdefc999aa8e3664f8014370886b8'

    # cmake reads CMAKE_TOOLCHAIN_FILE from the environment when configuring
    # a new build dir, so every configure step below picks this up
    - name: Use the vcpkg toolchain on Windows
      if: matrix.family == 'windows'
      shell: pwsh
      run: >
        "CMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
        | Out-File -FilePath $env:GITHUB_ENV -Append

    - name: Restore the soundfont from the cache if available
      uses: actions/cache@v6
      with:
        path: share/MS_Basic.sf3
        key: ${{matrix.os}}-soundfont_cache-v4

    # CMake checks the soundfont's hash
    - name: Download the soundfont if it's not cached
      shell: bash
      run: |
        if [ ! -f share/MS_Basic.sf3 ]; then
          curl --fail --location --output share/MS_Basic.sf3 "https://github.com/musescore/MuseScore/raw/v4.7.4/share/sound/MS%20Basic.sf3"
        fi

    # on MacOS, everything that needs the dependencies happens before they're
    # removed: building, and the deploy scripts, which run when the test builds
    # install themselves into test_install and when cpack packages

    - name: Configure with tests
      run: cmake --preset debug-tests

    - name: Build with tests
      run: cmake --build --preset debug-tests

    # coverage is measured from a separate Release build rather than the
    # Debug build -- in Release, NDEBUG makes Q_UNREACHABLE() compile to
    # __builtin_unreachable(), so unreachable arms emit no code instead of
    # showing up as uncovered lines. gcovr.cfg has the rest of the options.
    - name: Configure release build with tests for coverage on Ubuntu
      if: matrix.family == 'ubuntu'
      run: cmake --preset coverage

    - name: Build release build with tests for coverage on Ubuntu
      if: matrix.family == 'ubuntu'
      run: cmake --build --preset coverage

    - name: Configure without tests
      if: matrix.family != 'ubuntu'
      run: >
        cmake -S . -B without_tests
        -DCMAKE_BUILD_TYPE=Release
        -DCPACK_GENERATOR=${{ matrix.cpack_generator }}
        -DCPACK_PACKAGE_FILE_NAME=${{ matrix.package_name }}

    - name: Build without tests
      if: matrix.family != 'ubuntu'
      run: cmake --build without_tests --config Release

    - name: Package
      if: matrix.family != 'ubuntu'
      run: cd without_tests; cpack -C Release

    # proves the deploy script in CMakeLists.txt actually bundled everything
    # the tests need -- otherwise they'd silently pass against the installed
    # copies regardless of what got bundled, since dyld falls back to any
    # load-command path macdeployqt failed to rewrite to a bundle-relative
    # one
    - name: Remove dependencies before testing on MacOS
      if: matrix.family == 'macos'
      run: brew uninstall --ignore-dependencies $BREW_DEPS && brew autoremove

    - name: Test on MacOS and Ubuntu
      if: matrix.family != 'windows'
      run: ctest --preset debug-tests

    # same idea as the MacOS step above, but on Windows
    # install-qt-action puts Qt's own bin dir on PATH and sets
    # QT_PLUGIN_PATH, either of which could mask a gap in what
    # qt_generate_deploy_app_script/windeployqt actually deployed
    - name: Test on Windows
      if: matrix.family == 'windows'
      shell: pwsh
      run: |
        $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notlike "$env:QT_ROOT_DIR*" }) -join ';'
        Remove-Item Env:\QT_PLUGIN_PATH -ErrorAction SilentlyContinue
        ctest --preset debug-tests

    - name: Show QTest output on Windows
      if: always() && matrix.family == 'windows'
      shell: pwsh
      run: Get-Content build/debug-tests/test_output.txt

    - name: Test release build for coverage on Ubuntu
      if: matrix.family == 'ubuntu'
      run: ctest --preset coverage

    # options live in gcovr.cfg, which gcovr reads from the working directory.
    # exclude-throw-branches relies on GCC's "(throw)" branch annotation,
    # which clang's llvm-cov gcov emulation doesn't emit, so recheck it
    # before switching this build to clang
    - name: Run gcovr
      if: matrix.family == 'ubuntu'
      run: gcovr

    - name: Upload code coverage
      uses: codecov/codecov-action@v7
      if: matrix.family == 'ubuntu'
      with:
        # only upload the gcovr report. Otherwise the uploader also searches
        # for .gcno files and runs gcov itself, and those unfiltered reports
        # bypass everything in gcovr.cfg
        disable_search: true
        files: ./coverage.xml
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Upload package
      if: matrix.family != 'ubuntu'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.package_name }}
        path: |
          without_tests/Justly-*.zip
          without_tests/Justly-*.msi
        if-no-files-found: error

  # builds the Flatpak the way Flathub will, and uploads it as a bundle that
  # the release includes
  flatpak_job:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{matrix.os}}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11
      # flatpak-builder needs to make its own sandboxes
      options: --privileged
    steps:
    - name: Download
      uses: actions/checkout@v7

    - name: Build
      uses: flatpak/flatpak-github-actions/flatpak-builder@v6.8
      with:
        manifest-path: linux/io.github.bramtayl.Justly.yml
        arch: ${{matrix.arch}}
        bundle: Justly-Linux-${{matrix.arch}}.flatpak
        cache-key: flatpak-builder-${{ hashFiles('linux/*.yml', 'linux/*.yaml') }}

  # a separate job, so a release only happens if every platform passed,
  # and the platforms don't race each other to create it
  release_job:
    needs: [main_job, flatpak_job]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download packages
      uses: actions/download-artifact@v8
      with:
        path: packages
        merge-multiple: true

    - name: Release
      uses: softprops/action-gh-release@v3
      with:
        files: packages/*
