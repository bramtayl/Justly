xml = coverage.xml
filter = library/
exclude-throw-branches = yes
# branches gcc attaches to lines with no real code (closing braces,
# struct/constructor declarations)
exclude-unreachable-branches = yes

# In Debug builds Q_UNREACHABLE() lowers to an always-skipped assert call,
# which would otherwise show up as an uncovered line. The case labels that
# fall through into one are wrapped in GCOVR_EXCL_START/GCOVR_EXCL_STOP in
# the source instead, since no pattern can tell them apart from reachable
# case labels
exclude-lines-by-pattern = .*Q_UNREACHABLE.*
